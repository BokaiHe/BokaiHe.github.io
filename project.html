<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project · Bokai He</title>
  <meta name="color-scheme" content="light">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Serif+SC:wght@600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
  <link rel="stylesheet" href="style.css?v=16">
  <script>
    // Apply saved theme and language before first paint.
    try {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.dataset.theme = t;
      var l = localStorage.getItem('lang');
      if (l) document.documentElement.lang = l;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" data-name>Bokai He</a>
    <nav class="nav" aria-label="Sections">
      <a href="./#about" data-i18n="nav.about">About</a>
      <a href="./#projects" data-i18n="nav.projects">Projects</a>
      <a href="./#experience" data-i18n="nav.experience">Experience</a>
      <a href="./#contact" data-i18n="nav.contact">Contact</a>
    </nav>
    <div class="controls">
      <button class="chip" id="lang-toggle" type="button" aria-label="Switch language">中文</button>
      <button class="chip icon" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <main class="detail" id="detail"></main>

  <footer class="footer">
    <span>© <span id="year"></span> <span data-name>Bokai He</span></span>
  </footer>

  <script src="data.js?v=16"></script>
  <script src="main.js?v=16"></script>
</body>
</html>
